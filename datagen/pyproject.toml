[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "end-of-day-datagen"
version = "0.1.0"
description = "Generates large, consistent test data sets for the Gün Sonu database."
requires-python = ">=3.12"
dependencies = [
    "Faker>=40.0,<41",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17,<0.18",
]

[tool.setuptools]
py-modules = ["generate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
