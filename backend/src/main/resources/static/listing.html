<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paket ayrıntısı · Gün Sonu</title>
    <link rel="stylesheet" href="/css/main.css">
    <script type="module" src="/js/pages/listing.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>
    <main id="main" class="container">
      <p><a href="/index.html">← Paketlere dön</a></p>
      <div id="listing-message" class="message" hidden></div>
      <article id="listing" class="panel" hidden>
        <h1 id="listing-title"></h1>
        <p id="listing-business" class="card-business"></p>
        <p class="price">
          <span id="listing-sale-price" class="price-sale"></span>
          <s id="listing-normal-price" class="price-normal"></s>
        </p>
        <dl class="details">
          <dt>Açıklama</dt>
          <dd id="listing-description"></dd>
          <dt>Alerjen bilgisi</dt>
          <dd id="listing-allergens"></dd>
          <dt>Kalan adet</dt>
          <dd id="listing-remaining"></dd>
          <dt>Teslim alma aralığı</dt>
          <dd id="listing-window"></dd>
          <dt>İşletme adresi</dt>
          <dd id="listing-address"></dd>
          <dt>İşletme telefonu</dt>
          <dd id="listing-phone"></dd>
        </dl>
        <form id="add-form" class="inline-form" novalidate>
          <div class="field">
            <label for="quantity">Adet</label>
            <input id="quantity" name="quantity" type="number" min="1" step="1" value="1" required aria-describedby="quantity-error">
            <span class="field-error" id="quantity-error" data-error-for="quantity"></span>
          </div>
          <button type="submit" class="button">Sepete ekle</button>
        </form>
        <div id="add-message" class="message" hidden></div>
      </article>
    </main>
  </body>
</html>
