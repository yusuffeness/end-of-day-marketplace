<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>İşletme Raporları · Gün Sonu</title>
    <link rel="stylesheet" href="/css/main.css">
    <script type="module" src="/js/pages/business-reports.js"></script>
  </head>
  <body>
    <header id="site-header" class="site-header"></header>
    <main id="main" class="container">
      <h1>İşletme Raporları</h1>
      <div id="business-picker"></div>
      <div id="business-content">
        <form id="report-form" class="inline-form" novalidate>
          <div class="field">
            <label for="report-from">Başlangıç</label>
            <input id="report-from" name="from" type="date" required>
          </div>
          <div class="field">
            <label for="report-to">Bitiş</label>
            <input id="report-to" name="to" type="date" required>
          </div>
          <button type="submit" class="button">Raporu göster</button>
        </form>
        <p class="hint">Siparişler oluşturulma günlerine göre sayılır; aralık en fazla 366 gün olabilir.</p>
        <div id="report-message" class="message" hidden></div>
        <div id="report"></div>
      </div>
    </main>
  </body>
</html>
