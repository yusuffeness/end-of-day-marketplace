name: Bug
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The behaviour you observed, including error messages or response bodies.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: The behaviour you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - db
        - backend
        - frontend
        - datagen
        - docs
        - infra
    validations:
      required: false
